[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parthackbench"
version = "0.1.0"
description = "PartHackBench: certified equal-progress stress tests for partial-credit tool-agent evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
parthackbench = "parthackbench.cli:main"

[tool.setuptools.packages.find]
include = ["parthackbench*"]
